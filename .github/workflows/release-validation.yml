name: Release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Python driver and Moonraker contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate web contracts
        run: node --test tests/web/*.test.mjs

      - name: Validate installer syntax
        run: |
          sh -n install.sh
          sh -n ui-installer.sh
          sh -n uninstall.sh

      - name: Validate installer transactions and real symlinks
        run: |
          bash tests/installer/test-installer.sh
          bash tests/installer/test-install-scopes.sh
          bash tests/installer/test-install-failure.sh
          bash tests/installer/test-transaction-faults.sh
          bash tests/installer/test-mixed-baselines.sh

      - name: Verify release manifest
        run: sha256sum -c manifest.sha256

  fluidd-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Ace Pro Control Center
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Check out tested Fluidd source
        run: git clone --branch v1.37.2 --depth 1 https://github.com/fluidd-core/fluidd.git fluidd-upstream

      - name: Apply Ace Pro overlay
        run: cp -a fluidd-source-overlay/. fluidd-upstream/

      - name: Install Fluidd dependencies
        working-directory: fluidd-upstream
        run: pnpm install --frozen-lockfile

      - name: Test, type-check, lint and build Fluidd
        working-directory: fluidd-upstream
        run: |
          pnpm test:unit --run
          pnpm type-check
          pnpm lint
          pnpm build

      - name: Compare reproducible Fluidd distribution
        run: diff -qr fluidd-upstream/dist fluidd-dist

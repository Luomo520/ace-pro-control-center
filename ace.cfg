# =============================================================================
# 安装前必须实测/填写的参数
#
# 1. serial
#    ACE 的实际 USB 串口路径；建议使用 /dev/serial/by-id。
# 2. bowden_tube_length
#    ACE 出料口到五通进料口之间的实际 PTFE 管路长度。
#    五通附近允许少量误差，最终到达挤出机仍由上方传感器确认。
# 3. toolchange_load_length
#    ACE 停放位置到上方耗材传感器之间的最大送料长度。
#    数值应略大于实际路径，必须考虑送料齿轮打滑余量。
# 4. toolchange_retract_length
#    换料回收时从分料器方向回到 ACE 的距离，必须足以释放公共通道。
# 5. toolhead_sensor_to_nozzle
#    下方挤出机传感器到喷嘴之间的实际耗材长度。
# 6. extruder_sensor_pin / toolhead_sensor_pin
#    分别填写上方传感器和下方传感器的 Klipper MCU 针脚。
# 7. parking_sensor_pin（可选）
#    五通公共通道传感器的 MCU 针脚；未安装时不要填写该参数。
#    引脚由用户按本机 MCU 接线填写，安装包不会预填实际引脚。
# 8. parking_sensor_clear_move_length（配置五通传感器时必填）
#    回抽中五通传感器由“有料”稳定变为“无料”后，再向 ACE 回抽的总距离。
#    该值应按实际安装位置测量，并包含必要安全余量；不会再叠加
#    five_way_parking_margin。
# 9. CUT_TIP 的 cutter_x、cutter_y_start、cutter_y_hit
#    在下方宏中填写切刀的实际坐标；禁止直接照抄其他机器坐标。
# 10. [force_move] enable_force_move: True
#    ACE_PRELOAD 冷态预装载使用受传感器和距离上限约束的 FORCE_MOVE。
#    请在主配置已有的 [force_move] 节中启用，不要重复定义该配置节。
#
# 测量建议：先让耗材位于对应传感器位置，再沿实际耗材路径测量到 ACE
# 或喷嘴；长度略大于实测值即可，不要用过大的数值掩盖送料打滑。
# =============================================================================
# =============================================================================
# ACE Pro 管理中心 DIY 耗材路径示意图
#
# 送料方向：
#   [ACE T0-T3] --> [五通] --> [五通传感器（可选）] --> [上方传感器] --> [挤出机] --> [下方传感器] --> [喷嘴]
#       |                         |                       |                           |
#       |                         |                       |                           +-- toolhead_sensor_pin
#       |                         |                       +-- extruder_sensor_pin
#       |                         +-- parking_sensor_pin（可选）
#       +-- 快速送料 / 慢速接近 / 打滑补偿
#
# 换料回收方向：
#   [喷嘴] <-- [下方传感器] <--挤出机回抽-- [上方传感器] <-- [五通传感器] <-- [五通] <-- [ACE]
#                                                        |
#                                                        +-- 解除后按配置距离继续回抽
#
# 所有速度单位为 mm/s，所有距离单位为 mm。
# ACE 连续/断续送料都会实时监测上方传感器；工具头在每个 5/1 mm 分段后检查下方传感器。
# 送料失败只允许有限补偿，达到上限后暂停打印，不会无限磨料。
# ACE_PRELOAD INDEX=n CONFIRM=1 只冷态送到下方传感器，不加热、不归零、
# 不移动 XY/Z、不切料，也不会追加 toolhead_sensor_to_nozzle 距离。
# =============================================================================

[ace]
# ACE 的串口设备路径，优先使用 /dev/serial/by-id。
serial: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
#serial: /dev/ttyACM1
# ACE 串口波特率，通常保持 115200。
baud: 115200
# 原始 ACE RPC 调试开关。普通使用必须保持 False，避免控制台绕过受控命令。
enable_debug_rpc: False
# 手动 ACE_FEED 未指定 SPEED 时使用的默认速度。
feed_speed: 80
# 自动换料快速送料速度。当前值 160 mm/s，属于高速度配置。
feed_fast_speed: 160
# 接近上方传感器时的慢速送料速度。
feed_approach_speed: 25
# 自动送料最后多少距离切换为慢速。
feed_approach_length: 100
# 断续送料开关：False=连续送料，True=按下方分段参数断续送料。
# False 时主路径只发送一次完整距离请求，驱动仍实时监测上方传感器并立即停止。
# 主路径结束仍未触发时，只再执行一次有限低速打滑补偿。
intermittent_feed: False
# 快速送料单次请求的最大距离；1000 可取消每 100 mm 的停顿。
# 仅在 intermittent_feed: True 时生效。
feed_fast_chunk_length: 1000
# 正常送料长度结束后允许的最大打滑补偿距离。
feed_slip_compensation_length: 400
# 每次打滑补偿请求的距离。
# 仅在 intermittent_feed: True 时生效；连续模式会一次发送完整补偿距离。
feed_slip_compensation_chunk: 50
# 打滑补偿速度，建议保持低速。
feed_slip_compensation_speed: 25
# 手动 ACE_RETRACT 未指定 SPEED 时使用的默认回收速度。
retract_speed: 80
# 自动换料快速回收速度。
retract_fast_speed: 120
# 回收到停放位置前的慢速收尾速度。
retract_parking_speed: 25
# 回收总长度中最后多少距离使用慢速。
retract_parking_length: 200
# 断续回抽开关：False=快速段和慢速停放段各发送一次，True=按分段长度断续回抽。
# False 时仍保留最后 retract_parking_length 的慢速停放保护。
intermittent_retract: False
# 换色/换料时从 ACE 回收耗材的总长度。
toolchange_retract_length: 1200
# 下方传感器到喷嘴之间的送料距离。
toolhead_sensor_to_nozzle: 80
# ACE 向上方传感器送料的最大距离。
toolchange_load_length: 1200
# ACE 出料口到五通进料口之间的实际 PTFE 管路长度。
bowden_tube_length: 190
# 估算停放点向 ACE 方向额外回收的安全余量。
# 仅用于未配置 parking_sensor_pin 的旧兼容标定路径。
five_way_parking_margin: 20
# 可选五通公共通道传感器。未安装时删除或注释本行，即可关闭该功能。
# ☆☆☆☆☆ 填写本机五通传感器 MCU 引脚；未安装时保持注释。
#parking_sensor_pin: ^YOUR_MCU_PIN
# after_five_way=传感器在五通之后；before_five_way=传感器在五通之前。
parking_sensor_position: after_five_way
# 传感器解除后继续向 ACE 回抽的总距离；75 已包含全部安全余量。
# 该值不会再叠加 five_way_parking_margin。
parking_sensor_clear_move_length: 75
# 连续检测到 3 次目标状态才停止，降低机械抖动造成的误停概率。
parking_sensor_debounce_count: 3
# 搜索五通传感器解除状态时允许的最大回抽请求长度，达到上限会报错并停止。
calibration_max_retract_length: 1500
# 自动探测送料速度；默认与正常快速送料一致，传感器触发后驱动会立即请求停止。
calibration_feed_speed: 160
# 自动探测回抽速度；默认与正常快速回抽一致。
calibration_retract_speed: 120
# 自动探测的粗测分段长度；100 表示结果允许约一个分段范围的误差。
# 增大该值可减少启停、等待及料盘转动和耗材弹性带来的累计误差。
calibration_chunk_length: 100
# 接近估算停放点时的末段长度；当前默认不再追求毫米级精测。
calibration_final_chunk_length: 100
# ACE 烘干允许的最高温度。
max_dryer_temperature: 65

# 上方传感器触发后，挤出机先快速送料的速度。
toolhead_feed_fast_speed: 8
# 接近下方传感器时，挤出机慢速送料的速度。
toolhead_feed_slow_speed: 5
# 挤出机快速送料阶段的总距离。
toolhead_feed_fast_length: 10
# 快速送料阶段每次挤出机移动的距离。
toolhead_feed_fast_step: 5
# 慢速寻找下方传感器时每次挤出机移动的距离。
toolhead_feed_slow_step: 1
# 下方传感器触发后继续送到喷嘴的速度。
toolhead_to_nozzle_speed: 5

# 下方传感器未触发时，挤出机允许继续送料的最大总距离。
toolhead_sensor_max_feed_length: 200
# 传感器等待超时时间。
extruder_sensor_timeout: 15
# ACE 状态恢复为 ready 的最长等待时间。
ace_ready_timeout: 15
# 上方传感器触发并停止送料后，等待 ACE 恢复 ready 的最短时间。
# 驱动还会按当前请求的“距离/速度 + 3 秒”动态延长，避免慢速补偿被误判超时。
ace_stop_ready_timeout: 25
# 单个 ACE 请求的最长等待时间。
ace_request_timeout: 5
# ACE 断联后的最长重连等待时间。
ace_reconnect_timeout: 30
# 重连后保持稳定多久才允许恢复操作。
ace_reconnect_stable_time: 3
# 慢速送料、补偿和其他分段动作的默认分段长度。
# 对 ACE 主送料而言，仅在 intermittent_feed: True 时生效。
ace_motion_chunk_length: 100
# 单次断联恢复最多允许的重试次数。
ace_resume_max_retries: 1
# 是否启用换料断联后的自动传感器协调恢复。
auto_toolchange_recovery: True
# 自动换料恢复最多尝试次数。
auto_toolchange_recovery_max_retries: 3
# 断联恢复成功后是否自动继续原来被暂停的打印。
auto_resume_after_ace_reconnect: True
# 是否启用无限续料功能。
endless_spool: False
# True 时无限续料只允许切换到名称完全相同的材料；无法匹配时暂停打印。
endless_spool_require_same_material: True
# 无限续料断料传感器连续确认次数；默认 3 次约为 150ms。
# 仅在 print_stats=printing 时累计，待机、暂停和其他动作期间会清零。
runout_debounce_count: 3

# ☆☆☆☆☆ 上方和下方耗材传感器的 MCU 针脚，必须按本机接线填写。
#extruder_sensor_pin: ^YOUR_TOOLHEAD_MCU_PIN
#toolhead_sensor_pin: ^YOUR_TOOLHEAD_MCU_PIN

# 旧版兼容参数；当前驱动不使用该配置项。
#disable_assist_after_toolchange: true
#toolhead_sensor_to_nozzle: 50

# =============================================================================
# 耗材名称、烘干温度和耗材温度
#
# material_*_name：界面显示并用于匹配 ACE 槽位中的耗材名称。
# material_*_drying_temperature：ACE 烘干目标温度，不能超过
# max_dryer_temperature。
# material_*_temperature：推荐喷嘴/耗材打印温度，不用于控制烘干。
# 自定义耗材时，三个条目必须成组填写；名称匹配不区分大小写。
# =============================================================================

material_1_name: PLA
material_1_drying_temperature: 45
material_1_temperature: 210

material_2_name: ABS
material_2_drying_temperature: 60
material_2_temperature: 260

material_3_name: PETG
material_3_drying_temperature: 60
material_3_temperature: 250

material_4_name: ABSCF
material_4_drying_temperature: 60
material_4_temperature: 260

material_5_name: PAHTCF
material_5_drying_temperature: 60
material_5_temperature: 270

material_6_name: PETCF
material_6_drying_temperature: 60
material_6_temperature: 270

material_7_name: PEEK
material_7_drying_temperature: 60
material_7_temperature: 360

# 未匹配到配置名称时，自动烘干使用 45°C；耗材温度 0 表示未知。
unknown_material_drying_temperature: 45
unknown_material_temperature: 0
# 同时存在 PLA 与其他耗材时使用 50°C，并提示其他耗材效果可能受限。
mixed_material_drying_temperature: 50
# 未知或混合耗材时是否在界面显示警告。
show_material_warning: True

# =============================================================================
# CUT_TIP 示例宏
# 必须根据本机切刀位置、轴范围和机械结构修改后再取消注释。
# 安装包保持注释，禁止直接使用其他机器的坐标。
# =============================================================================
# [gcode_macro CUT_TIP]
# gcode:
#     RESPOND TYPE=echo MSG="正在切料..."
#     {% if "xyz" not in printer.toolhead.homed_axes %}
#         G28
#     {% endif %}
#     SAVE_GCODE_STATE NAME=my_move_up_state
#     G90
#     M117 正在切料
#     G1 X<cutter_x> Y<cutter_y_start> F6000
#     M400
#     G1 X<cutter_x> Y<cutter_y_hit> F600
#     G1 X<cutter_x> Y<cutter_y_start> F3000
#     M400
#     FORCE_MOVE STEPPER=extruder DISTANCE=-50 VELOCITY=10
#     M117 切料完成
#     RESPOND TYPE=echo MSG="切料完成"
#     RESTORE_GCODE_STATE NAME=my_move_up_state MOVE=1 MOVE_SPEED=200

[gcode_macro _ACE_PRE_TOOLCHANGE]
gcode:
    {action_respond_info("正在执行换色前准备")}
[gcode_macro _ACE_POST_TOOLCHANGE]
gcode:
    {action_respond_info("正在执行换色后处理")}
    {action_respond_info("换色完成")}


[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    {action_respond_info("料盘已空")}
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}


[gcode_macro TR]
gcode:
    ACE_CHANGE_TOOL TOOL=-1

[gcode_macro T0]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro T1]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro T2]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro T3]
gcode:
    ACE_CHANGE_TOOL TOOL=3

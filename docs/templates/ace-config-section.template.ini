# =============================================================================
# Ace Pro Control Center 配置功能区编写模板
#
# 用途：维护者新增或重写根 ace.cfg 功能区时参考此格式。
# 注意：本文件包含占位符，不是可运行配置、安装输入或发布默认值来源。
# 根目录 ace.cfg 是唯一可安装模板；不得把本文件扩写成第二套完整配置。
# 规范：docs/ACE_CONFIG_SPECIFICATION.zh-CN.md
# =============================================================================

# =============================================================================
# <功能区中文名称>
#
# 功能整体介绍：
# <说明该区域负责的完整流程、起点、终点和安全边界。>
#
# 路径或状态关系：
# +---------------------------------------------------------------------+
# | [起点] -> [传感器/动作] -> [终点]                                  |
# | 反向动作、触发条件和停止条件也必须画出。                             |
# +---------------------------------------------------------------------+
#
# 依赖：
# <列出传感器、宏、全局配置、状态或其他参数。>
#
# 互斥/覆盖：
# <列出互斥选项、继承关系和仅在某开关下生效的参数。>
# =============================================================================

# <安装/动作> ☆☆☆☆☆ <机器必填参数中文名称>。
#
# 作用：
# <说明驱动在哪个流程读取它，以及它影响哪一段物理动作。>
#
# 单位：
# <mm、mm/s、°C、秒、次数、枚举或布尔值。>
#
# 填写：
# <说明测量起点、终点、允许值、推荐初值和调整方法。>
# <说明必须在重启前完成，还是只需在首次对应机械动作前完成。>
#
# 依赖：
# <说明依赖的传感器、宏或其他配置。>
#
# 风险：
# <说明参数过大、过小、缺失或填写错误的表现。>
#
#machine_required_parameter: <MEASURED_VALUE>

# <安全默认参数中文名称>。
#
# 作用：
# <说明默认值影响的行为。>
#
# 单位：
# <填写单位。>
#
# 默认值/范围：
# <说明驱动默认值、模板值和合法范围，二者不同时必须分别写明。>
#
#safe_default_parameter: <DEFAULT_VALUE>

# 条件 ☆☆☆☆☆ <可选功能启用后必填参数中文名称>。
#
# 作用：
# <说明只有哪个功能启用后才读取。>
#
# 启用：
# <说明取消注释、设置开关或满足何种能力后启用。>
#
# 禁用：
# <说明不启用时应保持注释、False 或其他安全状态。>
#
# 依赖/互斥：
# <说明依赖项以及不能同时启用的配置。>
#
#optional_feature_parameter: <ACTUAL_VALUE>

# 覆盖参数示例。
# 保持注释时继承 <base_parameter>；取消注释后只覆盖 <方向/阶段>。
#override_parameter: <DEFAULT_VALUE>

# 材料档案必须三项成组填写，全部保留在 [ace] 内。
# 名称不区分大小写且不能重复；烘干温度不得超过安全上限。
#material_N_name: <MATERIAL_NAME>
#material_N_drying_temperature: <DRYING_TEMPERATURE>
#material_N_temperature: <PRINT_TEMPERATURE>

# 功能区结束前检查：
# 1. 每个活动参数都已由 extras/ace.py 读取并校验。
# 2. 不存在无法识别的活动占位符。
# 3. 条件参数的启用、禁用、依赖和互斥关系已经写清。
# 4. 机械动作参数写明单位、测量方法、上限和失败行为。
# 5. 参数变化会使探测结果失效时，已同步更新失效判定。
# 6. 参数或派生状态对外暴露时，Moonraker 状态/能力/校验、Fluidd
#    类型与界面、备用页已经同步，并明确权威数据来源。
# 7. ace.cfg、规范、驱动文档、安装文档和测试已经同时更新。
# 8. 未复制当前机器值、发布默认值表或固定活动参数数量到规范文档。
# 9. 配置版本、上下传感器消抖和绝对硬上限与当前驱动解析及测试一致。
# =============================================================================

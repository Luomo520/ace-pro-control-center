# ACE Pro 管理中心旧版机器动作宏迁移模板（legacy）
#
# 本文件不再由新安装创建，也不应被 printer.cfg 或 ace.cfg include。
# 它只作为旧版 V3 配置的迁移输入：安装器会把校准坐标和用户宏合并到 ace.cfg，
# 然后将打印机上的原文件归档为 ace_machine.cfg.legacy。坐标必须按打印机实测；
# 默认 -1 会在任何运动前停止，因此通用迁移不会误用本机示例坐标。
#
# 从用户旧 V2 ace.cfg 迁移的行为：
#   _ACE_PRE_TOOLCHANGE  -> 换料前归零门禁、保存位置、抬 Z、停车和升温
#   CUT_TIP              -> 本机切刀往复动作（移除重复的 FORCE_MOVE 回抽）
#   _ACE_POST_TOOLCHANGE -> 喷嘴清洁、下降已抬升的 Z 并恢复打印位置
#   _ACE_ON_EMPTY_ERROR  -> 仅在活动打印中暂停并给出路径检查提示
#
# V2 的 T0..T3/TR 不在本文件重复定义。V3 驱动按 ace.cfg 硬件拓扑管理区的设备顺序
# 注册 T0..T15/TR；打印头装载和卸载循环由下面两个桥接宏进入 Python 路径控制器。

[gcode_macro _ACE_MACHINE_PRE_TOOLCHANGE]
description: ACE Pro 管理中心换料前安全停车、抬 Z 与升温
variable_park_x: -1
variable_park_y: -1
variable_purge_temp_min: 240
variable_restore_position: 0
variable_z_lift: 0.0
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {% if park_x|float < 0 or park_y|float < 0 %}
        {action_raise_error("ACE Pro 管理中心：请先在 ace.cfg 中填写换料停车坐标")}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if state in ["printing", "paused"] %}
            {action_raise_error("ACE Pro 管理中心：打印中坐标未归零，已拒绝自动 G28")}
        {% else %}
            G28
        {% endif %}
    {% endif %}
    SAVE_GCODE_STATE NAME=ACE_V3_TOOLCHANGE
    {% set restore = 1 if state in ["printing", "paused"] else 0 %}
    {% set available_z = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set lift = [2.0, [0.0, available_z]|max]|min %}
    SET_GCODE_VARIABLE MACRO=_ACE_MACHINE_PRE_TOOLCHANGE VARIABLE=restore_position VALUE={restore}
    SET_GCODE_VARIABLE MACRO=_ACE_MACHINE_PRE_TOOLCHANGE VARIABLE=z_lift VALUE={lift}
    G91
    G1 Z{lift} F100
    M400
    G90
    G1 X{park_x} Y{park_y} F6000
    M400
    {% if printer.extruder.temperature < purge_temp_min|float %}
        {% if printer.extruder.target < purge_temp_min|float %}
            M109 S{purge_temp_min}
        {% else %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={purge_temp_min}
        {% endif %}
    {% endif %}
    {action_respond_info("ACE Pro 管理中心：换料前准备完成")}

[gcode_macro _ACE_MACHINE_CUT]
description: ACE Pro 管理中心本机切刀动作，不包含挤出机回抽
variable_cutter_x: -1
variable_cutter_y_start: -1
variable_cutter_y_hit: -1
gcode:
    {% if cutter_x|float < 0 or cutter_y_start|float < 0 or cutter_y_hit|float < 0 %}
        {action_raise_error("ACE Pro 管理中心：请先在 ace.cfg 中填写切刀坐标")}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("ACE Pro 管理中心：执行切刀前 XYZ 必须已经归零")}
    {% endif %}
    SAVE_GCODE_STATE NAME=ACE_V3_CUT
    G90
    G1 X{cutter_x} Y{cutter_y_start} F6000
    M400
    G1 X{cutter_x} Y{cutter_y_hit} F600
    G1 X{cutter_x} Y{cutter_y_start} F3000
    G1 X{cutter_x} Y{cutter_y_hit} F600
    G1 X{cutter_x} Y{cutter_y_start} F3000
    M400
    RESTORE_GCODE_STATE NAME=ACE_V3_CUT MOVE=1 MOVE_SPEED=200
    {action_respond_info("ACE Pro 管理中心：切料完成")}

[gcode_macro _ACE_MACHINE_LOAD_TO_TOOLHEAD]
description: ACE Pro 管理中心按传感器闭环或旁路标定距离装入打印头
gcode:
    ACE_PATH_LOAD_TO_TOOLHEAD TOOL={params.TOOL|default(-1)|int} DEVICE={params.DEVICE|default(-1)|int} SLOT={params.SLOT|default(-1)|int}

[gcode_macro _ACE_MACHINE_UNLOAD_FROM_TOOLHEAD]
description: ACE Pro 管理中心单轮打印头回抽，由驱动与 ACE 回抽交替调用
gcode:
    ACE_PATH_UNLOAD_STEP TOOL={params.TOOL|default(-1)|int} DEVICE={params.DEVICE|default(-1)|int} SLOT={params.SLOT|default(-1)|int}

[gcode_macro _ACE_MACHINE_POST_TOOLCHANGE]
description: ACE Pro 管理中心换料后清洁并恢复打印位置
variable_clean_nozzle: 0
gcode:
    {% set restore = printer["gcode_macro _ACE_MACHINE_PRE_TOOLCHANGE"].restore_position|int %}
    {% set lift = printer["gcode_macro _ACE_MACHINE_PRE_TOOLCHANGE"].z_lift|float %}
    {% set target = params.TO|default(-1)|int %}
    G91
    G1 Z-{lift} F100
    M400
    G90
    {% if target >= 0 and clean_nozzle|int == 1 %}
        CLEAN_NOZZLE
        M400
    {% endif %}
    RESTORE_GCODE_STATE NAME=ACE_V3_TOOLCHANGE MOVE={restore} MOVE_SPEED=200
    {action_respond_info("ACE Pro 管理中心：换料完成")}

[gcode_macro _ACE_MACHINE_PAUSE_ON_ERROR]
description: ACE Pro 管理中心换料错误时仅暂停活动打印
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {action_respond_info("ACE Pro 管理中心：换料未完成，请检查耗材路径和传感器")}
    {% if state == "printing" %}
        PAUSE
    {% endif %}

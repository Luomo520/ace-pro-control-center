# !!! 【切刀宏｜必用】宏名称：_ace_cut_filament
# 用途：移动到本机切刀位置，并完成两次切刀往复动作。
# 调用时机：旧耗材退出打印头路径之前。V3 不执行尖端成型，自动换料必须完成此动作。
# 物理动作：移动到 X10 Y330，在 Y330 与 Y350 之间往复两次后恢复原位置。
# 必须检查：XYZ 已归零、切刀方向、三个坐标、运动范围、速度和打印件避让空间。
# 默认状态：上方切刀绑定已启用，本动作实现仍整段注释。实现缺失时自动换料会被拒绝，手动模式仍可启动。
# 严重警告：禁止照搬坐标；必须按本机结构验证，否则可能撞机、误切或损坏切刀与打印头。
# [gcode_macro _ace_cut_filament]
# description: !!! 【切刀宏｜必用】移动到切刀位置并切断耗材
# variable_cutter_x: 10
# variable_cutter_y_start: 330
# variable_cutter_y_hit: 350
# gcode:
#     {% if "xyz" not in printer.toolhead.homed_axes %}
#         {action_raise_error("ACE：执行切刀之前必须先完成 XYZ 归零")}
#     {% endif %}
#     SAVE_GCODE_STATE NAME=ACE_CUT_FILAMENT
#     G90
#     G1 X{cutter_x} Y{cutter_y_start} F6000
#     M400
#     G1 X{cutter_x} Y{cutter_y_hit} F600
#     G1 X{cutter_x} Y{cutter_y_start} F3000
#     G1 X{cutter_x} Y{cutter_y_hit} F600
#     G1 X{cutter_x} Y{cutter_y_start} F3000
#     M400
#     RESTORE_GCODE_STATE NAME=ACE_CUT_FILAMENT MOVE=1 MOVE_SPEED=200
#     {action_respond_info("ACE：切料完成")}

# !!! 【擦嘴宏｜必用】宏名称：_ace_wipe_nozzle
# 用途：调用打印机已有的 CLEAN_NOZZLE，清除换料后喷嘴上的残料。
# 调用时机：新耗材装入后、恢复打印位置前；未完成本机清洁宏配置时保持样板注释。
# 物理动作：具体移动由 CLEAN_NOZZLE 决定，本驱动无法验证其坐标和方向。
# 必须检查：CLEAN_NOZZLE 已定义、清洁机构位置、归零要求、热床和打印件避让空间。
# 默认状态：上方绑定已启用，本动作实现仍整段注释。实现缺失时自动换料会被拒绝，手动模式仍可启动。
# 严重警告：未经空机低速验证不得启用，否则可能撞机或撞坏打印件。
# [gcode_macro _ace_wipe_nozzle]
# description: !!! 【擦嘴宏｜必用】调用本机宏清理喷嘴
# gcode:
#     CLEAN_NOZZLE
#     M400
#     {action_respond_info("ACE：喷嘴清理完成")}

# !!! 【换料后处理宏｜必用】宏名称：_ace_restore_after_toolchange
# 用途：下降换料前抬升的 Z，并恢复保存的运动状态和打印位置。
# 调用时机：送料和擦嘴完成后；必须与 _ace_prepare_toolchange 配套启用。
# 物理动作：Z 轴下降最多 2 mm，并以 MOVE_SPEED=200 恢复保存位置。
# 必须检查：前处理已成功保存 ACE_TOOLCHANGE、Z 方向、下降空间和恢复移动速度。
# 默认状态：上方绑定已启用，本动作实现仍整段注释。实现缺失时自动换料会被拒绝，手动模式仍可启动。
# 严重警告：单独启用或状态名错误可能撞击打印件、堵头或损坏挤出机。
# [gcode_macro _ace_restore_after_toolchange]
# description: !!! 【换料后处理宏｜必用】恢复高度、运动状态和打印位置
# gcode:
#     {% set prepare = printer["gcode_macro _ace_prepare_toolchange"] %}
#     {% set restore = prepare.restore_position|int %}
#     {% set lift = prepare.z_lift|float %}
#     G91
#     G1 Z-{lift} F100
#     M400
#     G90
#     RESTORE_GCODE_STATE NAME=ACE_TOOLCHANGE MOVE={restore} MOVE_SPEED=200
#     {action_respond_info("ACE：换料后恢复完成")}


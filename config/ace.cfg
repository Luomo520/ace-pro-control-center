########################################################################################################################
# ACE Pro 管理中心 - 通用 Klipper 共享配置
# 多 ACE 设备 / 单打印头拓扑
#
# 请根据本机结构编辑本文件。排版层级参考 Happy Hare 的 mmu_parameters.cfg；仅参考配置格式，
# 不引入 Happy Hare 的 MMU 参数、硬件假设或动作逻辑。
########################################################################################################################

# 使用前必读 ----------------------------------------------------------------------------------------------------------------
# 本文件统一保存硬件拓扑、打印头路径、动作策略、机器宏名称和本机动作宏。
# 设备数量、型号、串口、ACE2 总线及 UID 位于下方安装器管理区；其余用户配置不会被安装器改写。
# V3 不执行尖端成型。只要使用自动换料，就必须安装切刀并配置经过真机验证的切刀宏。
# 新安装仍以 manual 启动；未完成切刀、路径和安全动作配置时，只提供状态读取与 ACE 内置辅助送料。
#
# 风险标记：
#   !!! 必用宏 - 自动换料缺少该宏或宏未通过检查时不可用。
#   安装 ☆☆☆☆☆ - 重启 Klipper 前必须核对。
#   动作 ☆☆☆☆☆ - 首次送料、回抽或换料前必须实测。
#   条件 ☆☆☆☆☆ - 启用对应可选功能前必须核对。
#
# 配置关系：printer.cfg -> ace.cfg（本文件）；运行时不再引用独立 ace_hardware.cfg。

# >>> ACE DRIVER V3 HARDWARE TOPOLOGY BEGIN >>>
########################################################################################################################
# ACE Pro 管理中心 - 硬件拓扑配置（安装器生成）
# 多 ACE 设备 / 单打印头工具映射
#
# 排版层级参考 Happy Hare 的 mmu_parameters.cfg；这里只参考格式，不引入 MMU 参数或硬件假设。
########################################################################################################################

# 一、拓扑总表 ---------------------------------------------------------------------------------------------------------
# ████████╗ ██████╗ ██████╗  ██████╗ ██╗      ██████╗  ██████╗  ███████╗
# ╚══██╔══╝██╔═══██╗██╔══██╗██╔═══██╗██║     ██╔═══██╗██╔══██╗ ██╔════╝
#    ██║   ██║   ██║██████╔╝██║   ██║██║     ██║   ██║██████╔╝ █████╗
#    ██║   ██║   ██║██╔═══╝ ██║   ██║██║     ██║   ██║██╔═══╝  ██╔══╝
#    ██║   ╚██████╔╝██║     ╚██████╔╝███████╗╚██████╔╝██║      ███████╗
#    ╚═╝    ╚═════╝ ╚═╝      ╚═════╝ ╚══════╝ ╚═════╝ ╚═╝      ╚══════╝
#
# 本管理区只保存设备数量、逻辑顺序、型号、串口、ACE2 总线和 UID；共享速度、距离、传感器和机器宏位于同一 ace.cfg 的其他区域。
# 支持 1..4 台设备以及 ACE1+ACE1、ACE1+ACE2、ACE2+ACE2 等组合；增删设备必须重新运行安装命令。
#
# 逻辑设备与工具路径图：
# [ace0 槽1..4] -> [T0..T3]   \
# [ace1 槽1..4] -> [T4..T7]    \
# [ace2 槽1..4] -> [T8..T11]    > [共享耗材路径] -> [单打印头]
# [ace3 槽1..4] -> [T12..T15]  /
#
# 风险标记：安装 ☆☆☆☆☆ = 重启 Klipper 前核对；动作 ☆☆☆☆☆ = 首次物理动作前核对。

[ace_hardware]

# 要求驱动按第三代硬件拓扑契约解析本文件。
driver_version: 3                                                                               # 填写：固定为 3；单位：无
# 声明连续启用的 ace_device 节数量，并确定自动模式可换料的目标范围。
# 安装 ☆☆☆☆☆：数量与活动设备节不一致时，Klipper 会拒绝加载。
device_count: 1                                                                                 # 填写：填写 1..4，且必须与从 ace0 开始的连续活动设备节数量相同；单位：台
# 固定以配置顺序确定 ace0..ace3 和 T0..T15，不随 USB 枚举变化。
topology_mode: configured                                                                       # 填写：固定为 configured；单位：枚举值（configured）
# 二、活动设备明细 -----------------------------------------------------------------------------------------------
# ██████╗ ███████╗██╗   ██╗██╗ ██████╗███████╗███████╗
# ██╔══██╗██╔════╝██║   ██║██║██╔════╝██╔════╝██╔════╝
# ██║  ██║█████╗  ██║   ██║██║██║     █████╗  ███████╗
# ██║  ██║██╔══╝  ╚██╗ ██╔╝██║██║     ██╔══╝  ╚════██║
# ██████╔╝███████╗ ╚████╔╝ ██║╚██████╗███████╗███████║
# ╚═════╝ ╚══════╝  ╚═══╝  ╚═╝ ╚═════╝╚══════╝╚══════╝
#
# ACE1 必须使用独立串口；ACE2 可在同一 bus_id 下共享串口，
# 但同一总线上的每台 ACE2 必须填写不同且明确的 device_uid。

# ======================================================================================================================
#  █████╗  ██████╗███████╗       ██╗
# ██╔══██╗██╔════╝██╔════╝      ███║
# ███████║██║     █████╗        ╚██║
# ██╔══██║██║     ██╔══╝         ██║
# ██║  ██║╚██████╗███████╗       ██║
# ╚═╝  ╚═╝ ╚═════╝╚══════╝       ╚═╝
# 【ACE 1】逻辑编号 ace0 | 工具 T0..T3 | 已启用
# ======================================================================================================================
[ace_device ace0]

# 声明 ace0 使用的硬件协议型号。
# 安装 ☆☆☆☆☆：型号决定协议和能力，禁止凭外观猜测。
model: ace1                                                                                     # 填写：ACE Pro 1 填 ace1；ACE Pro 2 填 ace2；无法确认时可填 auto；单位：枚举值（ace1/ace2/auto）
# 声明该设备使用的通信传输类型。
transport: serial                                                                               # 填写：当前 V3 固定为 serial；单位：枚举值（serial）
# 绑定 ace0 的稳定串口或 ACE2 总线路径。
# 安装 ☆☆☆☆☆：路径必须存在，且不能依赖 /dev/ttyUSB* 枚举顺序。
serial: /dev/serial/by-id/REPLACE_WITH_STABLE_ACE1_PATH                                         # 填写：填写 /dev/serial/by-id/ 下的完整绝对路径；ACE1 必须独占；单位：Linux 设备路径（无物理单位）
# 决定驱动是否加载并监管该活动设备。
enabled: True                                                                                   # 填写：安装器生成的活动设备固定为 True；移除设备请重新运行安装器；单位：布尔值（True/False）
# 决定驱动是否采纳并展示该设备上报的 RFID 耗材元数据。
# 配置提示：False 仍保留槽位运行状态，但材质、颜色、温度等库存资料以手工配置为准。
rfid_enabled: True                                                                              # 填写：默认填写 True；如需完全使用手工库存并忽略硬件 RFID 元数据，可改为 False；单位：布尔值（True/False）
# 决定该设备是否具备送料、回抽、烘干和换料等物理动作能力。
# 安全提示：True 只解除设备动作门禁，不代表自动换料和机器宏已经配置完成。
physical_actions_enabled: False                                                                 # 填写：新安装保持 False；完成接线、路径和动作检查后才可手工改为 True；单位：布尔值（True/False）

# 三、未启用设备模板（全部保持注释） -------------------------------------------------------------------------------
# !!! 不要手动取消占位段注释。增删设备必须重新运行安装器，以生成连续的活动设备节。
# 公共字段速查（以下未启用设备共用，只说明一次）：
#   model = 协议型号（ace1 / ace2 / auto）；transport = 固定 serial。
#   serial = /dev/serial/by-id/ 稳定路径；enabled = 是否加载设备。
#   rfid_enabled = 是否采用 RFID 元数据；physical_actions_enabled = 物理动作门禁。
#   ACE2 启用后还会由安装器生成 bus_id 和唯一 device_uid。

# ======================================================================================================================
#  █████╗  ██████╗███████╗     ██████╗
# ██╔══██╗██╔════╝██╔════╝     ╚════██╗
# ███████║██║     █████╗        █████╔╝
# ██╔══██║██║     ██╔══╝       ██╔═══╝
# ██║  ██║╚██████╗███████╗     ███████╗
# ╚═╝  ╚═╝ ╚═════╝╚══════╝     ╚══════╝
# 【ACE 2】逻辑编号 ace1 | 工具 T4..T7 | 未启用
# ======================================================================================================================
# [ace_device ace1]
# model: ace1
# transport: serial
# serial: /dev/serial/by-id/REPLACE_WITH_ACE_DEVICE_2_SERIAL_PATH
# enabled: False
# rfid_enabled: True
# physical_actions_enabled: False
# 提示：该段仅用于识别字段；新增设备请重新运行安装器。

# ======================================================================================================================
#  █████╗  ██████╗███████╗     ██████╗
# ██╔══██╗██╔════╝██╔════╝     ╚════██╗
# ███████║██║     █████╗        █████╔╝
# ██╔══██║██║     ██╔══╝        ╚═══██╗
# ██║  ██║╚██████╗███████╗     ██████╔╝
# ╚═╝  ╚═╝ ╚═════╝╚══════╝     ╚═════╝
# 【ACE 3】逻辑编号 ace2 | 工具 T8..T11 | 未启用
# ======================================================================================================================
# [ace_device ace2]
# model: ace1
# transport: serial
# serial: /dev/serial/by-id/REPLACE_WITH_ACE_DEVICE_3_SERIAL_PATH
# enabled: False
# rfid_enabled: True
# physical_actions_enabled: False
# 提示：该段仅用于识别字段；新增设备请重新运行安装器。

# ======================================================================================================================
#  █████╗  ██████╗███████╗     ██╗  ██╗
# ██╔══██╗██╔════╝██╔════╝     ██║  ██║
# ███████║██║     █████╗       ███████║
# ██╔══██║██║     ██╔══╝       ╚════██║
# ██║  ██║╚██████╗███████╗          ██║
# ╚═╝  ╚═╝ ╚═════╝╚══════╝          ╚═╝
# 【ACE 4】逻辑编号 ace3 | 工具 T12..T15 | 未启用
# ======================================================================================================================
# [ace_device ace3]
# model: ace1
# transport: serial
# serial: /dev/serial/by-id/REPLACE_WITH_ACE_DEVICE_4_SERIAL_PATH
# enabled: False
# rfid_enabled: True
# physical_actions_enabled: False
# 提示：该段仅用于识别字段；新增设备请重新运行安装器。

# 四、组合填写规则 -----------------------------------------------------------------------------------------------
# ██████╗ █████╗ ██╗     ███████╗███████╗
# ██╔══██╗██╔══██╗██║     ██╔════╝██╔════╝
# ██████╔╝███████║██║     █████╗  ███████╗
# ██╔══██╗██╔══██║██║     ██╔══╝  ╚════██║
# ██████╔╝██║  ██║███████╗███████╗███████║
# ╚═════╝ ╚═╝  ╚═╝╚══════╝╚══════╝╚══════╝
#
# ACE1+ACE1：每台使用不同 serial，不填写 bus_id 或 device_uid。
# ACE1+ACE2：ACE1 独占 serial；ACE2 另填 serial、bus_id、device_uid。
# ACE2+ACE2：可分总线；也可共享 serial 和 bus_id，但 UID 必须不同。
# 3..4 台：继续按相同规则生成连续 ace2、ace3，配置顺序固定工具号。
# <<< ACE DRIVER V3 HARDWARE TOPOLOGY END <<<

[ace]
driver_version: 3                                                                               # V3 配置契约版本，请勿修改
toolchange_mode: manual                                                                         # 新安装默认手动模式；完成路径和机器动作检查后可改为 automatic
# ACE 内置辅助送料与自动换料相互独立：打印中允许启用辅助送料，但必须由用户显式确认。
# 停用辅助送料随时允许，不需要确认；physical_actions_enabled 为 False 时启用请求仍会被拒绝。
# 命令示例：待机时可用 ACE_ENABLE_FEED_ASSIST TOOL=T0；打印中必须使用 ACE_ENABLE_FEED_ASSIST TOOL=T0 CONFIRM=1。
# 自动换料开始装载前会先停用当前辅助送料；停用失败时换料立即中止，禁止两台 ACE 同时向共享路径送料。

# 一、路径传感器（引脚 / 去抖） -----------------------------------------------------------------------------------------------------
# ███████╗███████╗███╗   ██╗███████╗ ██████╗ ██████╗ ███████╗
# ██╔════╝██╔════╝████╗  ██║██╔════╝██╔═══██╗██╔══██╗██╔════╝
# ███████╗█████╗  ██╔██╗ ██║███████╗██║   ██║██████╔╝███████╗
# ╚════██║██╔══╝  ██║╚██╗██║╚════██║██║   ██║██╔══██╗╚════██║
# ███████║███████╗██║ ╚████║███████║╚██████╔╝██║  ██║███████║
# ╚══════╝╚══════╝╚═╝  ╚═══╝╚══════╝ ╚═════╝ ╚═╝  ╚═╝╚══════╝
#
# 传感器对象名由 V3 固定管理，用户不需要填写名称。每路只填写真实 pin，并按需调整连续确认次数。
# pin 留空表示未安装或停用；填写 pin 后由 V3 自动创建对应对象。pin 可使用 Klipper 的 ^、! 修饰符。
# 禁止照搬其他打印机的引脚；填写前必须确认 MCU 名称、引脚编号和触发电平。

# 上方传感器：位于 ACE 出料路径进入挤出机之前。
# 位置示意：[总五通] --> [编码器（可选）] --> >>> [上方传感器] <<< --> [挤出机] --> [下方传感器] --> [喷嘴]
# 安装 ☆☆☆☆☆：填写 pin 后必须核对 MCU 名称、触发电平和接线；留空即停用。
extruder_sensor_pin:                                                                            # 上方传感器引脚；留空表示未启用
extruder_sensor_debounce_count: 2                                                               # 连续确认次数，建议 2

# 下方传感器：位于挤出机与喷嘴之间。
# 位置示意：[上方传感器] --> [挤出机] --> >>> [下方传感器] <<< --> [喷嘴]
# 安装 ☆☆☆☆☆：CAN 工具板用户还需核对板名、引脚和触发电平；留空表示不读取该传感器。
# 下方传感器不是自动换料的必要条件。默认保留为只读监测，不参与装载、卸载、就绪或故障判断。
# 若本机确认下方传感器稳定可靠，可将 bypass 改为 False，启用原有的下方传感器闭环流程。
# bypass 只屏蔽控制依据，不屏蔽状态读取；默认模式必须填写上方传感器到喷嘴的实测送料距离。
# 25 mm 只是填写样板，不能直接视为本机校准结果。实测并低速复核后，再把 calibrated 改为 True。
toolhead_sensor_pin:                                                                            # 下方传感器引脚；留空表示未启用
toolhead_sensor_debounce_count: 2                                                               # 连续确认次数，建议 2
toolhead_sensor_bypass: True                                                                    # True 默认仅监测；False 才把下方传感器作为换料闭环依据
toolhead_sensor_bypass_load_length: 25                                                          # 上方触发点到喷嘴的实测步进距离；0 未标定，范围 0..250，25 仅为样板
toolhead_sensor_bypass_calibrated: False                                                        # 实测且低速验证后改为 True；False 时自动换料不会就绪

# 总五通传感器：单 ACE 时直接接收 ACE0 四槽；多 ACE 时位于各一级五通的公共出口。
# 单 ACE：[ACE0 槽0..3] --> >>> [总五通传感器] <<< --> [编码器（可选）] --> [打印头]
# 多 ACE：[ACE0 一级五通] --\
#          [ACE1 一级五通] ---+--> >>> [总五通传感器] <<< --> [编码器（可选）] --> [打印头]
#          [ACE2 一级五通] ---+
#          [ACE3 一级五通] --/
# 旧配置继续使用 rdm_sensor_* 名称；无论设备数量，总五通仍只有一个。
# 条件 ☆☆☆☆☆：未安装时 pin 留空；启用前确认它能检测进入打印头的唯一公共路径。
rdm_sensor_pin:                                                                                 # 总五通传感器引脚；留空表示未启用
rdm_sensor_debounce_count: 3                                                                    # 总五通连续确认次数，建议 3

# 一级五通传感器（仅 2 至 4 台 ACE）：单 ACE 不安装一级五通，下面四个 pin 全部留空。
# 单 ACE：[ACE0 槽0..3] -----------------------------------------------> [总五通]
# 多 ACE：[ACE0 槽0..3] --> >>> [ace0 一级五通传感器] <<< --\
#          [ACE1 槽0..3] --> >>> [ace1 一级五通传感器] <<< ---+
#          [ACE2 槽0..3] --> >>> [ace2 一级五通传感器] <<< ---+--> [总五通]
#          [ACE3 槽0..3] --> >>> [ace3 一级五通传感器] <<< --/
# 从第二台 ACE 开始，只填写实际安装设备对应的 pin；其余保持为空。一级传感器本身仍可不安装。
# 多 ACE 支持所有五通安装传感器，也支持只安装总五通传感器；后者必须实测各设备分支回退距离。
ace0_hub_sensor_pin:                                                                            # 多 ACE 的 ace0 一级传感器；单 ACE 留空
ace1_hub_sensor_pin:                                                                            # 多 ACE 的 ace1 一级传感器；单 ACE 留空
ace2_hub_sensor_pin:                                                                            # 多 ACE 的 ace2 一级传感器；未安装留空
ace3_hub_sensor_pin:                                                                            # 多 ACE 的 ace3 一级传感器；未安装留空
ace_hub_sensor_debounce_count: 3                                                                # 多 ACE 一级五通共用的连续确认次数，建议 3

# 二、共享编码器（可选） ----------------------------------------------------------------------------------------------------------
# ███████╗███╗   ██╗ ██████╗ ██████╗ ██████╗ ███████╗██████╗
# ██╔════╝████╗  ██║██╔════╝██╔═══██╗██╔══██╗██╔════╝██╔══██╗
# █████╗  ██╔██╗ ██║██║     ██║   ██║██║  ██║█████╗  ██████╔╝
# ██╔══╝  ██║╚██╗██║██║     ██║   ██║██║  ██║██╔══╝  ██╔══██╗
# ███████╗██║ ╚████║╚██████╗╚██████╔╝██████╔╝███████╗██║  ██║
# ╚══════╝╚═╝  ╚═══╝ ╚═════╝ ╚═════╝ ╚═════╝ ╚══════╝╚═╝  ╚═╝
#
# 全系统只使用一个共享编码器。固定位置为：总五通 -> 编码器 -> 上方传感器/挤出机。
# 位置示意：[总五通] --> >>> [共享编码器] <<< --> [上方传感器] --> [挤出机]
# ACE 直流电机阶段只用编码器确认“是否仍有实际移动”，不得用协议送料量计算真实位置或跟随率。
# 上方传感器触发后由挤出机步进电机接管；此阶段编码器才比较实测位移与命令距离的跟随率。
# 上方、下方、总五通和一级五通传感器仍负责判断路径中是否有料。
# 编码器不会自动追加送料、补偿打滑或代替任何有料传感器。未安装时 pin 保持为空并使用 off。
encoder_sensor_pin:                                                                             # 共享编码器脉冲引脚；留空表示未启用
encoder_resolution: 0                                                                           # 每个脉冲对应的毫米数；0 表示尚未校准，必须为有限非负数
encoder_detection_length: 20                                                                    # ACE 短窗口也检查零脉冲；此值是长窗口及挤出机跟随率的检测下限，单位 mm
encoder_min_tracking_ratio: 0.6                                                                 # 仅用于挤出机步进段；实测/命令低于此值时报告跟随不足，范围 0.01..1
encoder_mode: off                                                                               # off 不检测；monitor 读取显示但不作为依据；protect 故障时中止动作
encoder_print_mode: off                                                                         # off 关闭；monitor 只提示；pause 故障时请求暂停一次
encoder_print_detection_length: 20                                                              # 打印净挤出达到此距离仍无新脉冲时报告故障，必须为有限正数，单位 mm
# 只需读取脉冲、位移和故障记录时使用 encoder_mode: monitor；它不改变路径状态、换料就绪或重连结论。
# 三段人工校准仅允许在打印机待机、当前耗材已卸载、共享路径为 empty 且辅助送料关闭时进行：
# 1. 执行 ACE_ENCODER_CALIBRATE START=1；默认开始 3 段、每段目标 150 mm 的校准。
# 2. 用手准确推动耗材 150 mm，再执行 ACE_ENCODER_CALIBRATE LENGTH=150；按相同步骤共提交 3 段，LENGTH 应填写该段实测值。
# 3. 每段至少需要 2 个正向脉冲；段间偏差 <=5% 通过，>5% 且 <=10% 警告后保存，>10% 拒绝保存。
# 卡片“开始三段校准”执行相同流程；脉冲增加时控制台同步显示本段新增、本段累计和硬件累计，静止时不刷屏。
# LENGTH 必须是 0.01..2000 mm 范围内的有限数值；最终分辨率保存到 V3 运行状态，不改写本文件。
# 随时需要退出未完成的校准时执行 ACE_ENCODER_CALIBRATE CANCEL=1；取消不会驱动 ACE 或挤出机，完成或取消后停止计数输出。
# 校准过程不会驱动 ACE 或挤出机。protect 只能在编码器可用且已校准后启用，否则自动换料保持尚未就绪。
# 从 START 到完成三段或 CANCEL 之间显示“校准中”，驱动拒绝新的 ACE 运动、辅助送料启用和自动换料，防止混入无关脉冲。
# encoder_print_mode 与上面的 encoder_mode 相互独立，只在打印中、路径已装载且没有换料事务时工作。
# monitor 仅记录故障并提示；pause 还会调用 pause_on_error_macro 请求暂停一次。未配置编码器时静默停用，
# 不阻止 Klipper 启动或普通打印。故障中的“可能原因”只用于排查，不会触发自动送料、距离补偿或自动恢复。

# 三、共享路径速度与距离 ----------------------------------------------------------------------------------------------------------
# ███████╗██████╗ ███████╗███████╗██████╗ ███████╗
# ██╔════╝██╔══██╗██╔════╝██╔════╝██╔══██╗██╔════╝
# ███████╗██████╔╝█████╗  █████╗  ██║  ██║███████╗
# ╚════██║██╔═══╝ ██╔══╝  ██╔══╝  ██║  ██║╚════██║
# ███████║██║     ███████╗███████╗██████╔╝███████║
# ╚══════╝╚═╝     ╚══════╝╚══════╝╚═════╝ ╚══════╝
#
# 送丝方向（回抽方向相反）：
# 单 ACE：[ACE 槽位] -> [总五通/RDM] -> [可选共享编码器] -> [共享 Bowden 管] -> [打印头]
# 多 ACE：[ACE 槽位] -> [该 ACE 的一级五通] -> [总五通/RDM] -> [可选共享编码器]
#          -> [共享 Bowden 管] -> [上方传感器] -> [挤出机] -> [下方传感器] -> [喷嘴]
#
# 多台 ACE 共用箭头右侧的同一条路径和同一个打印头。速度单位均为 mm/s，距离单位均为 mm。
# 动作 ☆☆☆☆☆：以下路径值必须按本机实测。数值过大可能持续磨料、拉断耗材或使线盘缠绕。

# ACE 基础速度：用于手动动作；自动换料使用下面单独的快速速度。
feed_speed: 80                                                                                  # 默认送料速度
retract_speed: 80                                                                               # 默认回抽速度
feed_fast_speed: 160                                                                            # 自动换料主送料速度，首次建议从 80 验证
retract_fast_speed: 120                                                                         # 自动换料主回抽速度，首次建议从 80 验证

# ACE Pro 使用直流电机，下面两个“长度”都是设备协议参考送料量，不代表耗材真实位移。
# 驱动将主参考量和低速参考量拆成受限窗口；两者耗尽仍未触发时继续低速分段，直到上方触发或总超时。
# 补偿参考量设为 0 只表示跳过预设补偿段，不会关闭以上方传感器为终点的限时搜索。
feed_slip_compensation_length: 400                                                              # 附加参考送料量，不得用于推断耗材位置
feed_slip_compensation_speed: 25                                                                # 补偿送料速度

# 回抽停车阶段：无五通/RDM 传感器时，将总回抽的最后一段切换为低速。
retract_parking_length: 200                                                                     # 低速停车段长度，不得大于总回抽距离
retract_parking_speed: 25                                                                       # 低速停车段速度

# ACE 共享路径参数：630/150/1000 仅为模板起始值，不是通用校准结果。
# 动作 ☆☆☆☆☆：toolchange_retract_length 只覆盖打印头公共段；多 ACE 还必须填写下面各设备的一级五通距离。
toolchange_load_length: 630                                                                     # ACE 主参考送料总量；驱动会分段请求，不表示真实距离
upper_sensor_feed_timeout: 30                                                                   # 寻找上方传感器的总时间硬上限，范围 1..120 秒
toolchange_retract_length: 150                                                                  # 上方传感器释放后到总五通释放的最大回退距离
bowden_tube_length: 1000                                                                        # ACE 出料口到打印头路径的参考长度

# 多级五通分支距离（仅 2 至 4 台 ACE）：单 ACE 全部保留 0，运行时不会使用。
# 多 ACE 只校准已安装的设备；未安装设备保留 0，不参与运行。
# retract_length 是总五通释放后到对应一级五通释放的最大距离。有一级传感器时它是闭环搜索上限；
# 没有一级传感器时它是必须实测的盲回退距离。clear_move_length 是一级五通释放后继续退回的停车余量。
# 动作 ☆☆☆☆☆：多 ACE 自动换料要求每台可执行动作的 ACE 将 retract_length 校准为大于 0；默认 0 只允许状态读取。
ace0_hub_retract_length: 0                                                                      # ace0 总五通到一级五通的回退/搜索距离，单位 mm
ace0_hub_clear_move_length: 0                                                                   # ace0 退出一级五通后的停车余量，单位 mm
ace1_hub_retract_length: 0                                                                      # ace1 总五通到一级五通的回退/搜索距离，单位 mm
ace1_hub_clear_move_length: 0                                                                   # ace1 退出一级五通后的停车余量，单位 mm
ace2_hub_retract_length: 0                                                                      # ace2 总五通到一级五通的回退/搜索距离，单位 mm
ace2_hub_clear_move_length: 0                                                                   # ace2 退出一级五通后的停车余量，单位 mm
ace3_hub_retract_length: 0                                                                      # ace3 总五通到一级五通的回退/搜索距离，单位 mm
ace3_hub_clear_move_length: 0                                                                   # ace3 退出一级五通后的停车余量，单位 mm

# 打印头装载：默认在上方传感器触发后立即停止 ACE，再由挤出机按标定距离送到喷嘴。
# 编码器可验证挤出机是否真正带动耗材；下方传感器即使填写引脚，默认也只监测。
# 动作 ☆☆☆☆☆：所有距离必须按本机实测，距离过大会造成过量挤出或磨料。
# 仅当 toolhead_sensor_bypass: False 时，下面的下方传感器搜索参数才参与控制。
toolhead_feed_fast_speed: 10                                                                    # 快速接近速度
toolhead_feed_fast_length: 10                                                                   # 快速阶段累计长度
toolhead_feed_fast_step: 5                                                                      # 快速阶段单次步长
toolhead_feed_slow_speed: 5                                                                     # 低速寻找下方传感器的速度
toolhead_feed_slow_step: 1                                                                      # 低速阶段单次步长
toolhead_sensor_max_feed_length: 200                                                            # 寻找下方传感器的最大累计距离
toolhead_sensor_to_nozzle: 50                                                                   # 下方传感器到喷嘴的固定送料距离
toolhead_to_nozzle_speed: 8                                                                     # 送往喷嘴的速度；旁路固定送料也使用此速度

# 打印头卸载：挤出机与 ACE 交替回抽，直到上方传感器释放或达到最大轮数。
toolhead_unload_step_length: 50                                                                 # 每轮挤出机回抽长度
toolhead_unload_speed: 10                                                                       # 挤出机回抽速度
ace_unload_step_length: 100                                                                     # 每轮 ACE 协同回抽长度
toolhead_unload_max_attempts: 10                                                                # 最大闭环尝试轮数

# 单 ACE 路径收尾：总五通释放后再回抽固定余量；多 ACE 使用各设备分支距离。
rdm_clear_move_length: 100                                                                      # 单 ACE 总五通释放后的停车余量
sensor_trigger_grace_time: 3                                                                    # 传感器停止动作宽限时间，单位：秒

# 四、通信与安全策略 ------------------------------------------------------------------------------------------------------------
# ███████╗ █████╗ ███████╗███████╗████████╗██╗   ██╗
# ██╔════╝██╔══██╗██╔════╝██╔════╝╚══██╔══╝╚██╗ ██╔╝
# ███████╗███████║█████╗  █████╗     ██║    ╚████╔╝
# ╚════██║██╔══██║██╔══╝  ██╔══╝     ██║     ╚██╔╝
# ███████║██║  ██║██║     ███████╗   ██║      ██║
# ╚══════╝╚═╝  ╚═╝╚═╝     ╚══════╝   ╚═╝      ╚═╝
#
# 断联恢复只恢复连接和状态读取。V3 不自动重放结果未知的送料、回抽、切刀或换料动作。
connection_supervision: True                                                                    # 连接状态监管，建议保持 True

# 机器动作门禁：缺少必需宏时在任何 ACE 物理动作之前拒绝换料。
# 动作 ☆☆☆☆☆：通用驱动无法猜测喷嘴温度、挤出机动作、坐标或传感器位置。
require_path_hooks: True                                                                        # 强制要求装载和卸载路径宏
# !!! 必用 ☆☆☆☆☆：V3 不执行尖端成型，自动换料必须使用经过真机验证的切刀宏。
require_cut_hook: True                                                                          # 强制要求切刀宏；手动模式不执行自动换料

# 五、耗材、烘干与无限续料 ---------------------------------------------------------------------------------------------------------
# ███████╗██╗██╗            ███╗   ███╗ ██████╗ ███╗   ███╗████████╗
# ██╔════╝██║██║            ████╗ ████║██╔════╝ ████╗ ████║╚══██╔══╝
# █████╗  ██║██║            ██╔████╔██║██║  ███╗██╔████╔██║   ██║
# ██╔══╝  ██║██║            ██║╚██╔╝██║██║   ██║██║╚██╔╝██║   ██║
# ██║     ██║███████╗██╗    ██║ ╚═╝ ██║╚██████╔╝██║ ╚═╝ ██║   ██║
# ╚═╝     ╚═╝╚══════╝╚═╝    ╚═╝     ╚═╝ ╚═════╝ ╚═╝     ╚═╝   ╚═╝
#
# material_types 决定 Fluidd 卡片和独立控制页的候选项及顺序。使用英文逗号分隔，可自行增删或排序；
# 允许 1..32 项，每项最长 32 个字符，不允许空项或忽略大小写后的重复项。列表外材料仍可临时输入。
material_types: PLA, PLA+, PETG, PETG-CF, PETCF, ABS, ABSCF, ASA, TPU, PA, PA-CF, PAHTCF, PET-CF, PC, PBT-CF, PEEK, PVA, HIPS

# 条件 ☆☆☆☆☆：烘干前确认 ACE 型号、线盘和耗材允许该温度。
max_dryer_temperature: 55                                                                       # 烘干请求安全上限，单位：摄氏度，范围 0..90

# 无限续料默认关闭。启用前必须完成所有候选槽位的库存、路径和换料验证。
# exact 同时匹配材料和颜色；material 只匹配材料。ACE2 当前只读，不能成为物理续料目标。
endless_spool: False                                                                            # 启动后是否允许无限续料
endless_spool_match_mode: exact                                                                 # 匹配模式：exact / material

# 六、换料宏绑定 --------------------------------------------------------------------------------------------------------------
# 格式为“配置项: 宏名称  # !!! 【中文名称｜必用】用途”。七个绑定都是自动换料必用入口，必须保持活动。
# 手动模式不会调用自动换料钩子。前处理、切刀、擦嘴和后处理绑定默认活动，但下方机器动作样板仍保持注释；
# 用户必须先核对本机坐标、温度和机构，再启用样板或改绑到已经验证的本机宏，最后才可改为 automatic。
# 所有宏都不会绕过 physical_actions_enabled；任一必用实现缺失时只拒绝自动换料，不阻止 Klipper 启动。
[ace_machine]
pre_toolchange_macro: _ace_prepare_toolchange                                                   # !!! 【换料前处理宏｜必用】保存位置、抬升、停车并检查温度
cut_macro: _ace_cut_filament                                                                    # !!! 【切刀宏｜必用】V3 不执行尖端成型，自动换料必须切断旧耗材
load_to_toolhead_macro: _ace_load_filament_to_toolhead                                          # !!! 【送料宏｜必用】进入 V3 打印头送料路径
unload_from_toolhead_macro: _ace_unload_filament_from_toolhead                                  # !!! 【回料宏｜必用】进入 V3 打印头回料路径
wipe_nozzle_macro: _ace_wipe_nozzle                                                             # !!! 【擦嘴宏｜必用】调用本机喷嘴清理流程
post_toolchange_macro: _ace_restore_after_toolchange                                            # !!! 【换料后处理宏｜必用】恢复高度、运动状态和打印位置
pause_on_error_macro: _ace_pause_on_toolchange_error                                            # !!! 【故障暂停宏｜必用】换料失败时提示并暂停活动打印

# 七、活动的驱动入口 ------------------------------------------------------------------------------------------------------------
# !!! 【送料宏｜必用】宏名称：_ace_load_filament_to_toolhead
# 用途：把送料请求交给 V3 路径控制器，由传感器和距离上限共同约束。
# 调用时机：ACE 已把目标耗材送入共享路径之后；不得代替人工调试命令使用。
# 参数：TOOL、DEVICE、SLOT 由驱动传入；本宏不使用固定打印机坐标。
[gcode_macro _ace_load_filament_to_toolhead]
description: !!! 【送料宏｜必用】按闭环或旁路标定距离将耗材送入打印头
gcode:
    ACE_PATH_LOAD_TO_TOOLHEAD TOOL={params.TOOL|default(-1)|int} DEVICE={params.DEVICE|default(-1)|int} SLOT={params.SLOT|default(-1)|int}

# !!! 【回料宏｜必用】宏名称：_ace_unload_filament_from_toolhead
# 用途：执行一轮受控回抽，驱动会根据传感器状态决定是否继续下一轮。
# 调用时机：旧耗材退出打印头时；不得在挤出机温度或路径未确认时手动运行。
# 参数：TOOL、DEVICE、SLOT 由驱动传入；固定 -50 mm 的 FORCE_MOVE 不属于本流程。
[gcode_macro _ace_unload_filament_from_toolhead]
description: !!! 【回料宏｜必用】从打印头路径受控回抽耗材
gcode:
    ACE_PATH_UNLOAD_STEP TOOL={params.TOOL|default(-1)|int} DEVICE={params.DEVICE|default(-1)|int} SLOT={params.SLOT|default(-1)|int}

# !!! 【故障暂停宏｜必用】宏名称：_ace_pause_on_toolchange_error
# 用途：显示路径检查提示，并且只在正在打印时调用 PAUSE。
# 调用时机：已启动的自动换料失败后；手动模式忽略 T 指令时不得调用本宏。
# 物理动作：本宏不移动、不加热、不切料；允许由驱动自动调用。
[gcode_macro _ace_pause_on_toolchange_error]
description: !!! 【故障暂停宏｜必用】失败时提示并暂停活动打印
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {action_respond_info("ACE：换料未完成，请检查耗材路径和传感器")}
    {% if state == "printing" %}
        PAUSE
    {% endif %}

# 八、本机物理动作宏样板（默认保持注释） --------------------------------------------------------------------------------------------------
# 以下坐标只来自一台已经使用过的 V2 打印机，不是通用参数。它们不是可直接运行的默认值。
# 必用只表示自动换料必须提供此功能，不表示可以直接启用样板；取消注释前必须按本机低速逐项验证。

# !!! 【换料前处理宏｜必用】宏名称：_ace_prepare_toolchange
# 用途：保存打印位置、抬升 Z、移动到换料停车点，并把喷嘴加热到最低换料温度。
# 调用时机：自动换料开始时；必须与 _ace_restore_after_toolchange 配套启用。
# 物理动作：Z 抬升 2 mm，移动到 X289 Y350，喷嘴不足 240C 时等待升温。
# 必须检查：XYZ 已归零、可用 Z 高度、停车坐标、移动速度、喷嘴与材料允许温度。
# 默认状态：上方绑定已启用，本动作实现仍整段注释。实现缺失时自动换料会被拒绝，手动模式仍可启动。
# 严重警告：禁止照搬坐标，否则可能撞击机架、切刀或打印件并损坏打印头。
